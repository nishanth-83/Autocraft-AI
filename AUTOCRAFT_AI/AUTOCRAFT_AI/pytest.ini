[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Deterministic unit tests (planner, validator, tool registry, filesystem, mocked drivers)
    integration: Backend API, execution loop, recovery, local live Chromium browser, and frontend build integration tests
    windows_live: Live Windows 10/11 UI Automation desktop tests (requires Windows win32 desktop session)
    browser_live: Live browser navigation against requested external websites
